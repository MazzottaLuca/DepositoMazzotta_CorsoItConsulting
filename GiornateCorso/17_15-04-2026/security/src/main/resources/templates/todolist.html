<!DOCTYPE html>
<html lang="it" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Todo List</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .navbar {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 15px 30px;
            border-radius: 15px;
            margin-bottom: 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.15);
        }

        .navbar h1 {
            font-size: 28px;
            font-weight: 700;
        }

        .logout-btn {
            background: rgba(255, 255, 255, 0.2);
            border: 2px solid white;
            color: white;
            padding: 10px 20px;
            border-radius: 25px;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.3s ease;
            text-decoration: none;
            display: inline-block;
        }

        .logout-btn:hover {
            background: white;
            color: #667eea;
            transform: translateY(-2px);
        }

        .container {
            max-width: 1100px;
            margin: 0 auto;
        }

        .top-bar {
            display: flex;
            justify-content: space-between;
            gap: 20px;
            align-items: center;
            flex-wrap: wrap;
            margin-bottom: 25px;
        }

        .top-bar h2 {
            color: #333;
            font-size: 32px;
        }

        .top-bar a {
            color: #667eea;
            text-decoration: none;
            font-weight: 600;
        }

        .card {
            background: white;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.1);
            margin-bottom: 30px;
        }

        .card h3 {
            margin-bottom: 20px;
            color: #333;
            font-size: 24px;
        }

        .form-row {
            display: grid;
            grid-template-columns: 1.2fr 1fr;
            gap: 20px;
            margin-bottom: 20px;
        }

        .form-row label {
            display: block;
            margin-bottom: 8px;
            color: #555;
            font-weight: 600;
        }

        .form-row input,
        .form-row textarea {
            width: 100%;
            padding: 14px 16px;
            border: 2px solid #e1e5e9;
            border-radius: 12px;
            font-size: 16px;
            resize: vertical;
        }

        .form-row textarea {
            min-height: 130px;
        }

        .button-primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 15px 30px;
            border-radius: 14px;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .button-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 25px rgba(102, 126, 234, 0.25);
        }

        .todo-list {
            list-style: none;
            padding: 0;
            margin: 0;
        }

        .todo-item {
            display: grid;
            grid-template-columns: 1fr auto;
            gap: 20px;
            align-items: center;
            padding: 20px;
            border-bottom: 1px solid #e1e5e9;
        }

        .todo-item:last-child {
            border-bottom: none;
        }

        .todo-details {
            display: grid;
            gap: 10px;
        }

        .todo-title {
            font-size: 20px;
            font-weight: 700;
            color: #333;
        }

        .todo-description {
            color: #555;
            line-height: 1.6;
        }

        .todo-meta {
            color: #777;
            font-size: 14px;
        }

        .todo-actions {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }

        .todo-actions button {
            border: none;
            padding: 10px 18px;
            border-radius: 12px;
            cursor: pointer;
            font-weight: 700;
            transition: all 0.2s ease;
        }

        .todo-actions .secondary {
            background: #f5f7ff;
            color: #2f80ed;
        }

        .todo-actions .danger {
            background: #ffe9e9;
            color: #d64545;
        }

        .todo-actions .secondary:hover,
        .todo-actions .danger:hover {
            transform: translateY(-2px);
        }

        .completed {
            opacity: 0.75;
            text-decoration: line-through;
        }

        @media (max-width: 768px) {
            .form-row {
                grid-template-columns: 1fr;
            }

            .todo-item {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <div class="navbar">
        <h1>📋 Todo List</h1>
        <a class="logout-btn" href="/home">Torna alla Dashboard</a>
    </div>

    <div class="container">
        <div class="card">
            <h3>Crea un nuovo Todo</h3>
            <form th:action="@{/todolist/create}" method="post">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
                <div class="form-row">
                    <div>
                        <label for="title">Titolo</label>
                        <input id="title" name="title" type="text" placeholder="Titolo attività" required />
                    </div>
                    <div>
                        <label for="description">Descrizione</label>
                        <textarea id="description" name="description" placeholder="Descrivi l'attività"></textarea>
                    </div>
                </div>
                <button type="submit" class="button-primary">Aggiungi Todo</button>
            </form>
        </div>

        <div class="card">
            <h3>Elenco Todo</h3>
            <ul class="todo-list">
                <li class="todo-item" th:each="todo : ${todos}">
                    <div class="todo-details">
                        <div th:classappend="${todo.completed} ? 'completed' : ''" class="todo-title" th:text="${todo.title}"></div>
                        <div class="todo-description" th:text="${todo.description}"></div>
                        <div class="todo-meta">
                            Creato il <span th:text="${#temporals.format(todo.createdAt, 'dd/MM/yyyy HH:mm')}"></span>
                            <span th:if="${todo.completed}"> • Completato</span>
                        </div>
                    </div>
                    <div class="todo-actions">
                        <form th:action="@{'/todolist/' + ${todo.id} + '/toggle'}" method="post" style="display: inline;">
                            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
                            <button type="submit" class="secondary" th:text="${todo.completed} ? 'Segna non completato' : 'Completa'"></button>
                        </form>
                        <form th:action="@{'/todolist/' + ${todo.id} + '/delete'}" method="post" style="display: inline;">
                            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
                            <button type="submit" class="danger">Elimina</button>
                        </form>
                    </div>
                </li>
                <li th:if="${todos.isEmpty()}" class="todo-item">
                    <div class="todo-details">
                        <div class="todo-title">Nessun Todo presente</div>
                        <div class="todo-description">Crea il primo Todo per iniziare a gestire le attività.</div>
                    </div>
                </li>
            </ul>
        </div>
    </div>
</body>
</html>
