<!DOCTYPE html>
<html lang="it"
  xmlns:th="http://www.thymeleaf.org"
  xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestione Utenti - Admin</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .navbar {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 15px 30px;
            border-radius: 15px;
            margin-bottom: 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.15);
        }

        .navbar h1 {
            font-size: 24px;
            font-weight: 700;
        }

        .navbar-user {
            display: flex;
            align-items: center;
            gap: 20px;
        }

        .user-info {
            text-align: right;
        }

        .user-info p {
            margin: 3px 0;
            font-size: 14px;
        }

        .logout-btn {
            background: rgba(255, 255, 255, 0.2);
            border: 2px solid white;
            color: white;
            padding: 10px 20px;
            border-radius: 25px;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.3s ease;
            text-decoration: none;
            display: inline-block;
        }

        .logout-btn:hover {
            background: white;
            color: #667eea;
            transform: translateY(-2px);
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        .header-section {
            background: white;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.1);
            margin-bottom: 30px;
            text-align: center;
        }

        .header-section h2 {
            color: #333;
            margin-bottom: 15px;
            font-size: 32px;
            font-weight: 700;
        }

        .header-section p {
            color: #666;
            font-size: 16px;
        }

        .users-section {
            background: white;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.1);
            margin-bottom: 30px;
        }

        .users-section h3 {
            color: #333;
            margin-bottom: 20px;
            font-size: 24px;
            font-weight: 600;
            border-bottom: 2px solid #667eea;
            padding-bottom: 10px;
        }

        .user-table {
            width: 100%;
            border-collapse: collapse;
            margin-bottom: 20px;
        }

        .user-table th,
        .user-table td {
            padding: 15px;
            text-align: left;
            border-bottom: 1px solid #e1e5e9;
        }

        .user-table th {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            font-weight: 600;
        }

        .user-table tr:hover {
            background-color: #f8f9fa;
        }

        .role-badge {
            display: inline-block;
            padding: 4px 12px;
            border-radius: 15px;
            font-size: 12px;
            font-weight: 600;
            text-transform: uppercase;
        }

        .role-admin {
            background: linear-gradient(135deg, #ff6b6b 0%, #ff5252 100%);
            color: white;
        }

        .role-user {
            background: linear-gradient(135deg, #4ecdc4 0%, #44a08d 100%);
            color: white;
        }

        .action-btn {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: 20px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 600;
            margin-right: 8px;
            transition: all 0.3s ease;
            text-decoration: none;
            display: inline-block;
        }

        .action-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.3);
        }

        .action-btn.delete {
            background: linear-gradient(135deg, #ff6b6b 0%, #ff5252 100%);
        }

        .action-btn.delete:hover {
            box-shadow: 0 5px 15px rgba(255, 107, 107, 0.3);
        }

        .add-user-section {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            padding: 30px;
            border-radius: 15px;
            color: white;
            margin-bottom: 30px;
        }

        .add-user-section h3 {
            margin-bottom: 20px;
            font-size: 24px;
            font-weight: 600;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
        }

        .form-group input,
        .form-group select {
            width: 100%;
            padding: 12px;
            border: 2px solid rgba(255, 255, 255, 0.3);
            border-radius: 8px;
            background: rgba(255, 255, 255, 0.1);
            color: white;
            font-size: 16px;
        }

        .form-group input::placeholder {
            color: rgba(255, 255, 255, 0.7);
        }

        .form-group input:focus,
        .form-group select:focus {
            outline: none;
            border-color: white;
            background: rgba(255, 255, 255, 0.2);
        }

        .submit-btn {
            background: white;
            color: #667eea;
            border: none;
            padding: 12px 30px;
            border-radius: 25px;
            cursor: pointer;
            font-size: 16px;
            font-weight: 600;
            transition: all 0.3s ease;
        }

        .submit-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.2);
        }

        .back-link {
            text-align: center;
            margin-top: 30px;
        }

        .back-link a {
            color: #667eea;
            text-decoration: none;
            font-weight: 500;
            transition: color 0.3s;
        }

        .back-link a:hover {
            color: #764ba2;
            text-decoration: underline;
        }

        @media (max-width: 768px) {
            .navbar {
                flex-direction: column;
                gap: 15px;
                text-align: center;
            }

            .user-table {
                font-size: 14px;
            }

            .user-table th,
            .user-table td {
                padding: 10px;
            }

            .action-btn {
                padding: 6px 12px;
                font-size: 12px;
                margin-bottom: 4px;
                display: block;
                text-align: center;
            }
        }
    </style>
</head>
<body>
    <!-- Navbar -->
    <div class="navbar">
        <h1>👥 Gestione Utenti</h1>
        <div class="navbar-user">
            <div class="user-info">
                <p><strong th:text="'Admin: ' + ${username}"></strong></p>
                <span class="role-badge">Ruolo: ADMIN</span>
            </div>
            <form method="POST" th:action="@{/logout}" style="margin: 0">
                <button type="submit" class="logout-btn">Esci</button>
            </form>
        </div>
    </div>

    <!-- Main Container -->
    <div class="container">
        <!-- Header Section -->
        <div class="header-section">
            <h2>👑 Pannello di Gestione Utenti</h2>
            <p>Visualizza e gestisci tutti gli account utente del sistema</p>
        </div>

        <!-- Add New User Section -->
        <div class="add-user-section">
            <h3>➕ Aggiungi Nuovo Utente</h3>
            <form method="post" th:action="@{/admin/users/create}">
                <div class="form-group">
                    <label for="username">Username</label>
                    <input type="text" id="username" name="username" required placeholder="Inserisci username">
                </div>
                <div class="form-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" name="password" required placeholder="Inserisci password">
                </div>
                <div class="form-group">
                    <label for="role">Ruolo</label>
                    <select id="role" name="role" required>
                        <option value="USER">Utente</option>
                        <option value="ADMIN">Amministratore</option>
                    </select>
                </div>
                <button type="submit" class="submit-btn">Crea Utente</button>
            </form>
        </div>

        <!-- Users List Section -->
        <div class="users-section">
            <h3>📋 Lista Utenti</h3>
            <table class="user-table">
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Username</th>
                        <th>Ruolo</th>
                        <th>Azioni</th>
                    </tr>
                </thead>
                <tbody>
                    <!-- Esempio di righe - in produzione questi verrebbero popolati dinamicamente -->
                    <tr>
                        <td>1</td>
                        <td>admin</td>
                        <td><span class="role-badge role-admin">Admin</span></td>
                        <td>
                            <a href="/admin/users/edit/1" class="action-btn">Modifica</a>
                            <button class="action-btn delete" onclick="return confirm('Sei sicuro di voler eliminare questo utente?')">Elimina</button>
                        </td>
                    </tr>
                    <tr>
                        <td>2</td>
                        <td>user</td>
                        <td><span class="role-badge role-user">User</span></td>
                        <td>
                            <a href="/admin/users/edit/2" class="action-btn">Modifica</a>
                            <button class="action-btn delete" onclick="return confirm('Sei sicuro di voler eliminare questo utente?')">Elimina</button>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>

        <!-- Back to Admin Panel -->
        <div class="back-link">
            <p><a href="/admin/pannello">← Torna al Pannello Admin</a></p>
        </div>
    </div>
</body>
</html>
