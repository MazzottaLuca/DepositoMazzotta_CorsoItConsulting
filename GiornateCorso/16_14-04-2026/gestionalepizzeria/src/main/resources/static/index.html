<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestionale Pizzeria</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="container">
    <!-- Login Section -->
    <div id="loginSection" class="login-section">
        <div class="login-form">
            <h2>🍕 Gestionale Pizzeria</h2>
            <div class="form-group">
                <label for="userName">Nome Utente:</label>
                <input type="text" id="userName" placeholder="Inserisci il tuo nome">
            </div>
            <div class="form-group">
                <label for="userId">ID Utente (opzionale):</label>
                <input type="number" id="userId" placeholder="O inserisci il tuo ID">
            </div>
            <div class="form-group">
                <label>
                    <input type="checkbox" id="isAdmin">
                    Accedi come amministratore
                </label>
            </div>
            <button class="btn btn-primary" onclick="login()" style="width: 100%;">Accedi</button>
        </div>
    </div>

    <!-- Main Application -->
    <div id="mainApp" class="hidden">
        <!-- Header -->
        <div class="header">
            <h1>🍕 Gestionale Pizzeria</h1>
            <div class="user-info">
                <span id="currentUser"></span>
                <button class="btn btn-logout" onclick="logout()">Esci</button>
            </div>
        </div>

        <!-- Admin Section -->
        <div id="adminSection" class="hidden mt-20">
            <div class="card">
                <div class="admin-warning">
                    ⚠️ Stai accedendo come amministratore. Puoi modificare il menu della pizzeria.
                </div>
                <h2>Gestione Menu</h2>
                <div id="adminAlert" class="alert"></div>

                <h3 style="margin-top: 20px; margin-bottom: 15px; color: #333;">Aggiungi nuovo articolo</h3>
                <div class="form-group">
                    <label for="adminItemName">Nome articolo:</label>
                    <input type="text" id="adminItemName" placeholder="Es: Margherita">
                </div>
                <div class="form-group">
                    <label for="adminItemDesc">Descrizione:</label>
                    <textarea id="adminItemDesc" placeholder="Descrizione dell'articolo" rows="2"></textarea>
                </div>
                <div class="form-group">
                    <label for="adminItemPrice">Prezzo (€):</label>
                    <input type="number" id="adminItemPrice" placeholder="10.50" step="0.01" min="0">
                </div>
                <div class="form-group">
                    <label>
                        <input type="checkbox" id="adminItemAvailable" checked>
                        Disponibile
                    </label>
                </div>
                <button class="btn btn-primary" onclick="addMenuItem()">Aggiungi articolo</button>

                <h3 style="margin-top: 30px; margin-bottom: 15px; color: #333;">Modifica menu</h3>
                <div id="adminCarousel" class="carousel carousel-dark slide">
                    <div class="carousel-inner" id="adminMenuGrid" style="padding: 10px 40px;"></div>
                    <button class="carousel-control-prev" type="button" data-bs-target="#adminCarousel" data-bs-slide="prev" style="width: 40px;">
                        <span class="carousel-control-prev-icon" aria-hidden="true"></span>
                        <span class="visually-hidden">Precedente</span>
                    </button>
                    <button class="carousel-control-next" type="button" data-bs-target="#adminCarousel" data-bs-slide="next" style="width: 40px;">
                        <span class="carousel-control-next-icon" aria-hidden="true"></span>
                        <span class="visually-hidden">Successivo</span>
                    </button>
                </div>
            </div>
        </div>

        <!-- User Section -->
        <div id="userSection" class="hidden">
            <div class="main-grid">
                <!-- Menu Section -->
                <div class="card">
                    <h2>📋 Menu disponibile</h2>
                    <div id="menuAlert" class="alert"></div>
                    
                    <div id="menuCarousel" class="carousel carousel-dark slide">
                        <div class="carousel-inner" id="menuGrid" style="padding: 10px 40px;"></div>
                        <button class="carousel-control-prev" type="button" data-bs-target="#menuCarousel" data-bs-slide="prev" style="width: 40px;">
                            <span class="carousel-control-prev-icon" aria-hidden="true"></span>
                            <span class="visually-hidden">Precedente</span>
                        </button>
                        <button class="carousel-control-next" type="button" data-bs-target="#menuCarousel" data-bs-slide="next" style="width: 40px;">
                            <span class="carousel-control-next-icon" aria-hidden="true"></span>
                            <span class="visually-hidden">Successivo</span>
                        </button>
                    </div>

                    <div class="order-summary hidden" id="orderSummary">
                        <h3 style="color: #333; margin-bottom: 10px;">Il tuo ordine</h3>
                        <div id="orderItems"></div>
                        <div class="total-price" id="totalPrice">Totale: €0.00</div>
                        <button class="btn btn-primary" onclick="placeOrder()" style="width: 100%; margin-top: 15px;">Effettua ordine</button>
                    </div>
                </div>

                
            </div>
        </div>
    </div>
</div>

<!-- Bootstrap JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script src="script.js"></script>
</body>
</html>
